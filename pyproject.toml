[project]
name = "developer-intelligence"
version = "0.1.0"
description = "A platform for analyzing GitHub repositories"
readme = "README.md"
authors = [
    { name = "jmpardos", email = "" }
]
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.3",
]
